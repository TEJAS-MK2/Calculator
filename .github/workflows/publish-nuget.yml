name: Publish NuGet Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "nuget-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish NuGet package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuget-package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure GitHub Packages source
        run: dotnet nuget add source https://nuget.pkg.github.com/TEJAS-MK2/index.json --name github --username "${{ github.actor }}" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore package
        run: dotnet restore Pijush.Calculator.csproj

      - name: Run tests
        run: dotnet test tests/Calculator.Tests.csproj --configuration Release --no-restore

      - name: Build package
        run: dotnet build Pijush.Calculator.csproj --configuration Release --no-restore

      - name: Pack package
        run: dotnet pack Pijush.Calculator.csproj --configuration Release --no-build --output ./nupkg

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source github --api-key "$GITHUB_TOKEN" --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
