name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js calculator-core-ui.js anime-fallback.js sw.js packages/calculator-core/index.js packages/calculator-core/advanced.js packages/calculator-core/exact.js packages/calculator-core/test.js packages/calculator-core/exact.test.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Test calculator core package
        working-directory: packages/calculator-core
        run: npm test

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: Validate required application assets
        run: |
          set -e
          for file in index.html styles.css script.js calculator-core-ui.js anime-fallback.js sw.js manifest.json packages/calculator-core/index.js packages/calculator-core/advanced.js packages/calculator-core/exact.js; do
            test -f "$file"
          done

      - name: Validate HTML references
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\'](?:\./)?([^"\'?#]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://', 'https://', '//', '#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(sorted(set(missing))))
          print('All local HTML assets exist.')
          PY

      - name: Prepare Pages site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site/packages/calculator-core
          cp index.html styles.css script.js calculator-core-ui.js anime-fallback.js sw.js manifest.json _site/
          cp packages/calculator-core/index.js packages/calculator-core/advanced.js packages/calculator-core/exact.js _site/packages/calculator-core/
          touch _site/.nojekyll

      - name: Validate Pages artifact module imports
        working-directory: _site
        run: |
          set -e
          node --check packages/calculator-core/index.js
          node --check packages/calculator-core/advanced.js
          node --check packages/calculator-core/exact.js
          test -f calculator-core-ui.js
          test -f packages/calculator-core/advanced.js
          test -f packages/calculator-core/exact.js

      - name: Run browser smoke tests against Pages artifact
        run: |
          set -e
          node -e "const fs=require('fs'); const p='tests/browser-smoke.mjs'; let s=fs.readFileSync(p,'utf8'); s=s.replace(\"const port = 4173;\", \"const port = 4173;\").replace(\"['-m', 'http.server', String(port), '--bind', '127.0.0.1']\", \"['-m', 'http.server', String(port), '--bind', '127.0.0.1']\").replace(\"/index.html\`,\", \"/index.html`,\"); fs.writeFileSync('/tmp/browser-smoke-pages.mjs', s);"
          sed -i "s|process.cwd()|process.cwd()|g" /tmp/browser-smoke-pages.mjs
          (cd _site && python -m http.server 4173 --bind 127.0.0.1 >/tmp/pages-server.log 2>&1 & echo $! >/tmp/pages-server.pid)
          trap 'kill $(cat /tmp/pages-server.pid) 2>/dev/null || true' EXIT
          sleep 1
          npx playwright test --help >/dev/null 2>&1 || true
          node -e "const { chromium } = require('playwright'); (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage(); const e=[]; p.on('pageerror',x=>e.push(x.message)); p.on('console',m=>{if(m.type()==='error') e.push(m.text())}); await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'}); if(e.length) throw new Error(e.join(' | ')); await b.close();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
