name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages is currently configured to publish from the gh-pages branch.
# Writing that branch is therefore required for the deployment workflow.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js calculator-core-ui.js sw.js packages/calculator-core/index.js packages/calculator-core/test.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Test calculator core package
        working-directory: packages/calculator-core
        run: npm test

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: Validate required application assets
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f calculator-core-ui.js
          test -f sw.js
          test -f manifest.json
          test -f packages/calculator-core/index.js

      - name: Validate HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\'](?:\./)?([^"\'?#]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://', 'https://', '//', '#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(sorted(set(missing))))
          print('All local HTML assets exist.')
          PY

      - name: Prepare Pages site
        run: |
          set -e
          rm -rf _site
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf _deploy
          git worktree add --force _deploy origin/gh-pages

          cd _deploy
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a ../_site/ ./
          git add --all

          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
