name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js calculator-core-ui.js sw.js packages/calculator-core/index.js packages/calculator-core/test.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Test calculator core package
        working-directory: packages/calculator-core
        run: npm test

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: Validate required application assets
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f calculator-core-ui.js
          test -f sw.js
          test -f manifest.json
          test -f packages/calculator-core/index.js

      - name: Validate HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\'](?:\./)?([^"\'?#]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://', 'https://', '//', '#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(sorted(set(missing))))
          print('All local HTML assets exist.')
          PY

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOY_AUTHOR_NAME="TEJAS MK2"
          DEPLOY_AUTHOR_EMAIL="300078060+TEJAS-MK2@users.noreply.github.com"
          git config user.name "$DEPLOY_AUTHOR_NAME"
          git config user.email "$DEPLOY_AUTHOR_EMAIL"

          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf _deploy
          git worktree add --force _deploy origin/gh-pages

          cd _deploy

          # The old Pages history was authored by github-actions[bot].
          # Replace that deployment-only history with a clean root commit
          # attributed to the repository owner, then use normal commits after.
          if git log --format='%an <%ae>' | grep -Fq 'github-actions[bot]'; then
            git checkout --orphan clean-pages
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            rsync -a ../_site/ ./
            git add --all
            git commit -m "deploy: clean Pages history"
            git push --force origin HEAD:gh-pages
            exit 0
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a ../_site/ ./
          git add --all
          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
          else
            git commit -m "deploy: ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
