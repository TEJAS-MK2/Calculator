name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy directly through GitHub Pages instead of committing generated files
# to gh-pages. This keeps deployment commits out of repository history and
# prevents github-actions[bot] from appearing as a repository contributor.

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js calculator-core-ui.js sw.js packages/calculator-core/index.js packages/calculator-core/test.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Test calculator core package
        working-directory: packages/calculator-core
        run: npm test

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: Validate required application assets
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f calculator-core-ui.js
          test -f sw.js
          test -f manifest.json
          test -f packages/calculator-core/index.js

      - name: Validate HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\'](?:\./)?([^"\'?#]+)', html)
          missing = []

          for ref in refs:
              if ref.startswith(('http://', 'https://', '//', '#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)

          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(sorted(set(missing))))

          print('All local HTML assets exist.')
          PY

      - name: Prepare Pages site
        run: |
          set -e
          rm -rf _site
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
