name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js calculator-core-ui.js sw.js packages/calculator-core/index.js packages/calculator-core/test.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Test calculator core package
        working-directory: packages/calculator-core
        run: npm test

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: Validate required application assets
        run: |
          set -e
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f calculator-core-ui.js
          test -f sw.js
          test -f manifest.json
          test -f packages/calculator-core/index.js

      - name: Validate HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\'](?:\./)?([^"\'?#]+)', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://', 'https://', '//', '#')):
                  continue
              if not Path(ref).exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(sorted(set(missing))))
          print('All local HTML assets exist.')
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
