name: Browser tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Initialize test workspace
        run: npm init -y

      - name: Install Playwright
        run: npm install --no-save playwright@1.61.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs
