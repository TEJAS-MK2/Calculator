name: Publish Python Package

on:
  workflow_dispatch:
  push:
    paths:
      - "python-package/**"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and package
        run: python -m pip install --upgrade pip build pytest && python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Read package version
        id: package-version
        run: python -c "import tomllib; print('version=' + tomllib.load(open('pyproject.toml','rb'))['project']['version'])" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: published
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          name = "pijush-calculator"
          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/{name}/json"
          already = False
          try:
              with urllib.request.urlopen(url, timeout=10) as response:
                  data = json.load(response)
              already = version in data.get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          print(f"already_published={str(already).lower()}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"already_published={str(already).lower()}\n")
          PY

      - name: Publish to PyPI
        if: steps.published.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-package/dist/
