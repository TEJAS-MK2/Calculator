name: Cross-language conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            setup: node
            path: .
            command: node conformance/check-javascript.mjs
          - name: Python
            setup: python
            path: python-package
            command: python ../conformance/check-python.py
          - name: Ruby
            setup: ruby
            path: ruby-gem
            command: ruby ../conformance/check-ruby.rb
          - name: Java Maven
            setup: java
            path: java-package
            command: mvn -B test
          - name: Java Gradle
            setup: gradle
            path: gradle-package
            command: gradle test
          - name: .NET
            setup: dotnet
            path: nuget-package
            command: dotnet test tests/Calculator.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: matrix.setup == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Python
        if: matrix.setup == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python test dependencies
        if: matrix.setup == 'python'
        working-directory: python-package
        run: |
          python -m pip install --upgrade pip pytest hatch
          python -m pip install -e .

      - name: Setup Ruby
        if: matrix.setup == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Setup Java
        if: matrix.setup == 'java' || matrix.setup == 'gradle'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: matrix.setup == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Setup .NET
        if: matrix.setup == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Run conformance suite
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.command }}
