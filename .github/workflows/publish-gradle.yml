name: Publish Gradle Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'gradle-package/**'
      - '.github/workflows/publish-gradle.yml'
    tags:
      - "gradle-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Gradle package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gradle-package
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.0.0'

      - name: Run tests
        run: gradle test

      - name: Build package
        run: gradle build

      - name: Publish to GitHub Packages
        run: gradle publish
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
