name: Publish calculator-core to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/calculator-core/package.json'
      - 'packages/calculator-core/index.js'
      - 'packages/calculator-core/test.js'
      - 'packages/calculator-core/LICENSE'
      - '.github/workflows/publish-github-package.yml'
    tags:
      - 'calculator-core-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/calculator-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@tejas-mk2'

      - name: Test package
        run: npm test

      - name: Verify package
        run: npm pack --dry-run

      - name: Check whether version is already published
        id: package-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@tejas-mk2/calculator-core@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is already published; skipping duplicate publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.package-version.outputs.already_published != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
