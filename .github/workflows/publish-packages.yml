name: Test and Publish Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-engines:
    name: Test calculation engines (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            path: packages/calculator-core
            command: npm test
          - name: Python
            path: python-package
            command: python -m pytest
          - name: Ruby
            path: ruby-gem
            command: ruby -Ilib -Itest test/test_pijush_calculator.rb
          - name: Java Maven
            path: java-package
            command: mvn -B test
          - name: Java Gradle
            path: gradle-package
            command: gradle test
          - name: .NET
            path: nuget-package
            command: dotnet test tests/Calculator.Tests.csproj
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        if: matrix.name == 'JavaScript'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Python
        if: matrix.name == 'Python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Ruby
        if: matrix.name == 'Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Setup Java
        if: matrix.name == 'Java Maven' || matrix.name == 'Java Gradle'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        if: matrix.name == 'Java Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Setup .NET
        if: matrix.name == '.NET'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'
      - name: Install Python test dependencies
        if: matrix.name == 'Python'
        working-directory: python-package
        run: |
          python -m pip install --upgrade pip pytest hatch
          python -m pip install -e .
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.command }}

  publish-npm:
    name: Publish npm package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Publish @tejas-mk2/calculator-core
        working-directory: packages/calculator-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

  publish-nuget:
    name: Publish NuGet package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'
      - name: Pack
        working-directory: nuget-package
        run: dotnet pack Pijush.Calculator.csproj -c Release
      - name: Publish to GitHub Packages
        working-directory: nuget-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/TEJAS-MK2/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate

  publish-maven:
    name: Publish Maven package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Maven credentials
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Java package
        working-directory: java-package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests

  publish-gradle:
    name: Publish Gradle package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Publish Gradle package
        working-directory: gradle-package
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publishGprPublicationToGitHubPackagesRepository

  publish-container:
    name: Publish container
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push calculator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tejas-mk2/calculator:latest
            ghcr.io/tejas-mk2/calculator:${{ github.ref_name }}

  publish-python:
    name: Publish Python package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build package
        working-directory: python-package
        run: python -m build
      - name: Publish to PyPI
        if: ${{ env.PYPI_TOKEN != '' }}
        working-directory: python-package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
      - name: Skip PyPI publish when token is unavailable
        if: ${{ env.PYPI_TOKEN == '' }}
        run: echo "PYPI_API_TOKEN is not configured; package was built but not uploaded."

  publish-ruby:
    name: Publish Ruby gem
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test-engines
    runs-on: ubuntu-latest
    env:
      RUBYGEMS_TOKEN: ${{ secrets.RUBYGEMS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build gem
        working-directory: ruby-gem
        run: gem build pijush-calculator.gemspec
      - name: Publish to RubyGems
        if: ${{ env.RUBYGEMS_TOKEN != '' }}
        working-directory: ruby-gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push *.gem
      - name: Skip RubyGems publish when key is unavailable
        if: ${{ env.RUBYGEMS_TOKEN == '' }}
        run: echo "RUBYGEMS_API_KEY is not configured; gem was built but not uploaded."
