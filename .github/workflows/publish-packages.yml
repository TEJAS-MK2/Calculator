name: Test and Publish Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-engines:
    name: Test calculation engines (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            path: packages/calculator-core
            command: npm test
          - name: Python
            path: python-package
            command: python -m pytest
          - name: Ruby
            path: ruby-gem
            command: ruby -Ilib -Itest test/test_pijush_calculator.rb
          - name: Java Maven
            path: java-package
            command: mvn -B test
          - name: Java Gradle
            path: gradle-package
            command: gradle test
          - name: .NET
            path: nuget-package
            command: dotnet test tests/Calculator.Tests.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        if: matrix.name == 'JavaScript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Setup Python
        if: matrix.name == 'Python'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Setup Ruby
        if: matrix.name == 'Ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'
      - name: Setup Java
        if: matrix.name == 'Java Maven' || matrix.name == 'Java Gradle'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        if: matrix.name == 'Java Gradle'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.1'
      - name: Setup .NET
        if: matrix.name == '.NET'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'
      - name: Install Python test dependencies
        if: matrix.name == 'Python'
        working-directory: python-package
        run: |
          python -m pip install --upgrade pip pytest hatch
          python -m pip install -e .
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.command }}

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package.json
      - name: Install browser test dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser

  release-gate:
    name: Validate release tag and package versions
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate synchronized semantic versions
        run: node scripts/check-release-versions.mjs

  publish-npm:
    name: Publish npm package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Check whether npm version already exists
        id: npm-version
        working-directory: packages/calculator-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          registry=https://npm.pkg.github.com
          metadata_url="$registry/@tejas-mk2%2fcalculator-core"
          body=/tmp/npm-metadata.json
          status=$(curl -sS -o "$body" -w '%{http_code}' -u "x-access-token:${NODE_AUTH_TOKEN}" -H 'Accept: application/json' "$metadata_url")
          case "$status" in
            200)
              node - "$body" "$version" <<'NODE'
          const fs = require('node:fs');
          const [file, version] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(file, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exists=${Object.prototype.hasOwnProperty.call(metadata.versions ?? {}, version)}\n`);
          NODE
              ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to determine npm package state (HTTP $status)." >&2; cat "$body" >&2; exit 1 ;;
          esac
      - name: Publish @tejas-mk2/calculator-core
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/calculator-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

  publish-nuget:
    name: Publish NuGet package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'
      - name: Build
        working-directory: nuget-package
        run: dotnet build Pijush.Calculator.csproj -c Release
      - name: Pack
        working-directory: nuget-package
        run: dotnet pack Pijush.Calculator.csproj -c Release --no-build
      - name: Publish to GitHub Packages
        working-directory: nuget-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/TEJAS-MK2/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate

  publish-maven:
    name: Publish Maven package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Maven credentials
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether Maven version already exists
        id: maven-version
        working-directory: java-package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          url="https://maven.pkg.github.com/TEJAS-MK2/Calculator/io/github/tejas-mk2/pijush-calculator/${version}/pijush-calculator-${version}.pom"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$url")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to determine Maven package state (HTTP $status)." >&2; exit 1 ;;
          esac
      - name: Publish Java package
        if: steps.maven-version.outputs.exists != 'true'
        working-directory: java-package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests

  publish-gradle:
    name: Publish Gradle package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.1'
      - name: Check whether Gradle version already exists
        id: gradle-version
        working-directory: gradle-package
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(gradle -q properties | awk '/^version: / {print $2; exit}')
          url="https://maven.pkg.github.com/TEJAS-MK2/Calculator/io/github/tejasmk2/gradle/pijush-calculator-gradle/${version}/pijush-calculator-gradle-${version}.pom"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -u "$USERNAME:$GITHUB_TOKEN" "$url")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to determine Gradle package state (HTTP $status)." >&2; exit 1 ;;
          esac
      - name: Publish Gradle package
        if: steps.gradle-version.outputs.exists != 'true'
        working-directory: gradle-package
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publishGprPublicationToGitHubPackagesRepository

  publish-container:
    name: Publish container
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push calculator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tejas-mk2/calculator:latest
            ghcr.io/tejas-mk2/calculator:${{ github.ref_name }}

  publish-python:
    name: Publish Python package with PyPI Trusted Publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build package
        working-directory: python-package
        run: python -m build
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-package/dist/
          skip-existing: true

  publish-ruby:
    name: Publish Ruby gem
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0'
      - name: Require RubyGems credential
        run: test -n "$RUBYGEMS_API_KEY"
      - name: Build gem
        working-directory: ruby-gem
        run: gem build pijush-calculator.gemspec
      - name: Check whether RubyGems version already exists
        id: ruby-version
        working-directory: ruby-gem
        run: |
          set -euo pipefail
          version=$(ruby -e 'spec = Gem::Specification.load("pijush-calculator.gemspec"); puts spec.version')
          status=$(curl -sS -o /tmp/rubygems-versions.json -w '%{http_code}' "https://rubygems.org/api/v1/versions/pijush-calculator.json")
          case "$status" in
            200)
              VERSION="$version" ruby -rjson -e 'data=JSON.parse(File.read("/tmp/rubygems-versions.json")); v=ENV.fetch("VERSION"); puts(data.any? { |x| x["number"] == v } ? "exists=true" : "exists=false")' >> "$GITHUB_OUTPUT"
              ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unable to determine RubyGems package state (HTTP $status)." >&2; exit 1 ;;
          esac
      - name: Publish to RubyGems
        if: steps.ruby-version.outputs.exists != 'true'
        working-directory: ruby-gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push *.gem
