name: Test and Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-engines:
    name: Test calculation engines (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            path: packages/calculator-core
            command: npm test
          - name: Python
            path: python-package
            command: python -m pytest
          - name: Ruby
            path: ruby-gem
            command: ruby -Ilib -Itest test/test_pijush_calculator.rb
          - name: Java Maven
            path: java-package
            command: mvn -B test
          - name: Java Gradle
            path: gradle-package
            command: gradle test
          - name: .NET
            path: nuget-package
            command: dotnet test tests/Calculator.Tests.csproj
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        if: matrix.name == 'JavaScript'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Setup Python
        if: matrix.name == 'Python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup Ruby
        if: matrix.name == 'Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Setup Java
        if: matrix.name == 'Java Maven' || matrix.name == 'Java Gradle'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        if: matrix.name == 'Java Gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Setup .NET
        if: matrix.name == '.NET'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Install Python test dependencies
        if: matrix.name == 'Python'
        working-directory: python-package
        run: |
          python -m pip install --upgrade pip pytest hatch
          python -m pip install -e .
      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.command }}

  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Initialize test workspace
        run: npm init -y
      - name: Install Playwright
        run: npm install --no-save playwright@1.61.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs

  publish-npm:
    name: Publish npm package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - name: Check whether npm version already exists
        id: npm-version
        working-directory: packages/calculator-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          version=$(node -p "require('./package.json').version")
          existing=$(npm view "@tejas-mk2/calculator-core@${version}" version --registry=https://npm.pkg.github.com 2>/dev/null)
          if [ "$existing" = "$version" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@tejas-mk2/calculator-core@${version} already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "@tejas-mk2/calculator-core@${version} is not present; publishing."
          fi
      - name: Publish @tejas-mk2/calculator-core
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/calculator-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

  publish-nuget:
    name: Publish NuGet package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Build
        working-directory: nuget-package
        run: dotnet build Pijush.Calculator.csproj -c Release
      - name: Pack
        working-directory: nuget-package
        run: dotnet pack Pijush.Calculator.csproj -c Release --no-build
      - name: Publish to GitHub Packages
        working-directory: nuget-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "bin/Release/*.nupkg" --source "https://nuget.pkg.github.com/TEJAS-MK2/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate

  publish-maven:
    name: Publish Maven package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Maven credentials
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Java package
        working-directory: java-package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(mvn -B deploy -DskipTests 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -q '409'; then
            echo 'Maven version already exists in GitHub Packages; treating duplicate as successful.'
            exit 0
          fi
          exit $status

  publish-gradle:
    name: Publish Gradle package
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Publish Gradle package
        working-directory: gradle-package
        env:
          USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(gradle publishGprPublicationToGitHubPackagesRepository 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -q '409'; then
            echo 'Gradle version already exists in GitHub Packages; treating duplicate as successful.'
            exit 0
          fi
          exit $status

  publish-container:
    name: Publish container
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push calculator image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tejas-mk2/calculator:latest
            ghcr.io/tejas-mk2/calculator:${{ github.ref_name }}

  publish-python:
    name: Publish Python package with PyPI Trusted Publishing
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build package
        working-directory: python-package
        run: python -m build
      - name: Check whether PyPI version already exists
        id: pypi-version
        working-directory: python-package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/pijush-calculator/${version}/json")
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pijush-calculator ${version} already exists on PyPI; skipping upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pijush-calculator ${version} is not present on PyPI; Trusted Publishing will be used."
          fi
      - name: Publish to PyPI using Trusted Publishing
        if: steps.pypi-version.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-package/dist/
          skip-existing: true

  publish-ruby:
    name: Publish Ruby gem
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test-engines, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Build gem
        working-directory: ruby-gem
        run: gem build pijush-calculator.gemspec
      - name: Publish to RubyGems
        if: env.RUBYGEMS_API_KEY != ''
        working-directory: ruby-gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set +e
          output=$(gem push *.gem 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -Eq 'Repushing of gem versions is not allowed|already exists|already been pushed'; then
            echo 'RubyGems version already exists; treating duplicate as successful.'
            exit 0
          fi
          exit $status
      - name: Skip RubyGems publish when key is unavailable
        if: env.RUBYGEMS_API_KEY == ''
        run: echo "RUBYGEMS_API_KEY is not configured; gem was built but not uploaded."
