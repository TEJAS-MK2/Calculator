name: Publish Ruby gem to GitHub Packages

on:
  workflow_dispatch:
  push:
    paths:
      - "ruby-gem/**"
      - ".github/workflows/publish-ruby-gem.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby-gem
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Build gem
        run: gem build pijush-calculator.gemspec

      - name: Configure GitHub Packages credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.gem"
          printf -- "---\n:github: Bearer %s\n" "$GITHUB_TOKEN" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"

      - name: Validate gem
        run: gem specification pijush-calculator-*.gem >/dev/null

      - name: Publish to GitHub Packages
        run: gem push --key github --host https://rubygems.pkg.github.com/TEJAS-MK2 pijush-calculator-*.gem
