plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.tejasmk2.gradle'
version = '0.1.0'

description = 'Lightweight, dependency-free Java arithmetic engine published with Gradle.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'pijush-calculator-gradle'
            version = project.version
            pom {
                name = 'pijush-calculator-gradle'
                description = 'Lightweight, dependency-free Java arithmetic engine published with Gradle.'
                url = 'https://github.com/TEJAS-MK2/Calculator'
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/TEJAS-MK2/Calculator')
            credentials {
                username = System.getenv('USERNAME') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}
