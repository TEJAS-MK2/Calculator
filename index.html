<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A compact modern calculator with history, clear, theme controls, and smooth Anime.js motion.">
  <meta name="theme-color" content="#191919" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="manifest" href="./manifest.json">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <button class="sidebar-open" id="sidebarOpen" type="button" aria-label="Open calculator controls" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="feature-sidebar" id="featureSidebar" aria-hidden="true">
    <div class="sidebar-head"><span class="sidebar-title">Controls</span><button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close controls"><i class="fas fa-xmark" aria-hidden="true"></i></button></div>
    <nav class="feature-list" aria-label="Calculator controls">
      <button class="feature-item" data-feature="history" type="button"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i><span>History</span></button>
      <button class="feature-item" data-feature="clear" type="button"><i class="fas fa-eraser" aria-hidden="true"></i><span>Clear</span></button>
      <button class="feature-item" data-feature="theme" type="button"><i class="fas fa-circle-half-stroke" aria-hidden="true"></i><span>Theme</span></button>
    </nav>
  </aside>
  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="calculator-container"><main class="calculator" aria-label="Calculator">
      <div class="display-container" aria-live="polite"><div class="expression-preview" id="expressionPreview"></div><div class="display-secondary" id="displaySecondary">0</div><div class="display-primary" id="displayPrimary">0</div></div>
      <div class="history-panel" id="historyPanel" aria-hidden="true"><div class="history-header"><span>Calculation History</span><span class="history-count" id="historyCount">0</span></div><div class="history-list" id="historyList"><div class="history-empty">No calculations yet</div></div></div>
      <div class="button-grid">
        <button class="btn btn-function" data-action="clear-all" type="button">AC</button><button class="btn btn-number" data-number="7" type="button">7</button><button class="btn btn-number" data-number="8" type="button">8</button><button class="btn btn-number" data-number="9" type="button">9</button>
        <button class="btn btn-number" data-number="4" type="button">4</button><button class="btn btn-number" data-number="5" type="button">5</button><button class="btn btn-number" data-number="6" type="button">6</button><button class="btn btn-operator" data-action="divide" type="button">÷</button>
        <button class="btn btn-number" data-number="1" type="button">1</button><button class="btn btn-number" data-number="2" type="button">2</button><button class="btn btn-number" data-number="3" type="button">3</button><button class="btn btn-operator" data-action="multiply" type="button">×</button>
        <button class="btn btn-number btn-zero" data-number="0" type="button">0</button><button class="btn btn-number" data-action="decimal" type="button">.</button><button class="btn btn-operator" data-action="subtract" type="button">−</button><button class="btn btn-operator btn-add" data-action="add" type="button">+</button>
        <button class="btn btn-equals btn-equals-wide" data-action="equals" type="button">=</button>
      </div>
    </main></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" integrity="sha512-aNMyYYxdIxIaot0Y1/PLuEu3eipGCmsEUBrUq+7aVyPGMFH8z0eTP0tkqAvv34fzN6z+201d3T8HPb1svWSKHQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./script.js"></script>
  <script type="module" src="./calculator-core-ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(error => {
        console.warn('[Calculator] Service worker registration failed:', error);
      }), { once: true });
    }
  </script>
</body>
</html>
