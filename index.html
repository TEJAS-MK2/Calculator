<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Aesthetic Calculator - fast, responsive calculator"><meta name="theme-color" content="#000000" id="themeColor"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calculator"><link rel="manifest" href="./manifest.json"><title>Aesthetic Calculator</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css?v=10"><link rel="stylesheet" href="./graph.css?v=1"><link rel="stylesheet" href="./statistics.css?v=1"><style>.feature-sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:var(--bg-secondary);border-right:1px solid var(--border);box-shadow:18px 0 45px rgba(0,0,0,.3);z-index:1000;transform:translateX(-105%);transition:transform .28s ease;padding:14px;display:flex;flex-direction:column;gap:10px}.feature-sidebar.is-open{transform:translateX(0)}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease}.sidebar-backdrop.is-open{opacity:1;pointer-events:auto}.sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;border-bottom:1px solid var(--border)}.sidebar-title{font-size:.9rem;font-weight:600;color:var(--text-primary)}.sidebar-close,.sidebar-open{border:1px solid var(--border);background:var(--surface-2);color:var(--text-primary);cursor:pointer;border-radius:9px}.sidebar-close{width:32px;height:32px}.sidebar-open{position:fixed;top:10px;left:10px;width:34px;height:34px;z-index:1001;font-size:.8rem}.feature-list{display:grid;gap:6px;overflow:auto}.feature-item{width:100%;min-height:40px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text-primary);padding:0 11px;text-align:left;font:500 .72rem Inter,sans-serif;cursor:pointer}.feature-item i{width:17px;text-align:center;color:var(--text-secondary)}.feature-item:hover,.feature-item.active{background:var(--surface-2)}.sidebar-note{margin-top:auto;color:var(--text-secondary);font-size:.6rem;text-align:center;padding-top:8px;border-top:1px solid var(--border)}@media(max-width:480px){.feature-sidebar{width:min(82vw,280px);padding:10px}.sidebar-open{top:8px;left:8px;width:34px;height:34px}.calculator-container{padding-top:2.4rem}}</style></head><body><button class="sidebar-open" id="sidebarOpen" type="button" aria-label="Open calculator features"><i class="fas fa-bars"></i></button><div class="sidebar-backdrop" id="sidebarBackdrop"></div><aside class="feature-sidebar" id="featureSidebar" aria-hidden="true"><div class="sidebar-head"><span class="sidebar-title">Calculator Features</span><button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close features"><i class="fas fa-xmark"></i></button></div><div class="feature-list"><button class="feature-item" data-feature="basic"><i class="fas fa-calculator"></i><span>Basic Calculator</span></button><button class="feature-item" data-feature="scientific"><i class="fas fa-flask"></i><span>Scientific Mode</span></button><button class="feature-item" data-feature="history"><i class="fas fa-clock-rotate-left"></i><span>History</span></button><button class="feature-item" data-feature="memory"><i class="fas fa-memory"></i><span>Memory</span></button><button class="feature-item" data-feature="graph"><i class="fas fa-chart-line"></i><span>Graphing Calculator</span></button><button class="feature-item" data-feature="statistics"><i class="fas fa-chart-simple"></i><span>Statistics Mode</span></button><button class="feature-item" data-feature="theme"><i class="fas fa-circle-half-stroke"></i><span>Change Theme</span></button></div><div class="sidebar-note">Select a feature to open it</div></aside><div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center"><div class="calculator-container"><div class="calculator-header"><div class="header-row"><h1 class="calculator-title">CALCULATOR</h1><button class="theme-toggle" id="themeToggle" type="button" aria-label="Change theme"><i class="fas fa-moon"></i></button></div></div><div class="calculator"><div class="display-container"><div class="expression-preview" id="expressionPreview" aria-live="polite"></div><div class="display-secondary" id="displaySecondary">0</div><div class="display-primary" id="displayPrimary">0</div></div><div class="calculator-tools"><button class="tool-button" id="historyToggle" type="button" aria-expanded="false"><i class="fas fa-clock-rotate-left"></i> History</button><button class="tool-button danger" id="clearHistory" type="button"><i class="fas fa-trash"></i> Clear</button></div><div class="history-panel" id="historyPanel" aria-hidden="true"><div class="history-header"><span>Calculation History</span><span class="history-count" id="historyCount">0</span></div><div class="history-list" id="historyList"><div class="history-empty">No calculations yet</div></div></div><div class="memory-panel"><div class="memory-status"><i class="fas fa-memory"></i><span>Memory</span><strong id="memoryValue">0</strong></div><div class="memory-buttons"><button class="memory-button" data-action="memory-clear">MC</button><button class="memory-button" data-action="memory-recall">MR</button><button class="memory-button" data-action="memory-add">M+</button><button class="memory-button" data-action="memory-subtract">M−</button><button class="memory-button" data-action="memory-store">MS</button></div></div><button class="scientific-toggle" id="scientificToggle" type="button" aria-expanded="false"><i class="fas fa-flask"></i> Scientific Mode</button><div class="scientific-panel" id="scientificPanel" aria-hidden="true"><button class="btn btn-scientific" data-action="sin">sin</button><button class="btn btn-scientific" data-action="cos">cos</button><button class="btn btn-scientific" data-action="tan">tan</button><button class="btn btn-scientific" data-action="log">log</button><button class="btn btn-scientific" data-action="ln">ln</button><button class="btn btn-scientific" data-action="sqrt">√</button><button class="btn btn-scientific" data-action="square">x²</button><button class="btn btn-scientific" data-action="reciprocal">1/x</button><button class="btn btn-scientific" data-action="percent">%</button><button class="btn btn-scientific" data-action="pi">π</button><button class="btn btn-scientific" data-action="e">e</button><button class="btn btn-scientific" data-action="factorial">x!</button></div><button class="scientific-toggle graph-toggle" id="graphToggle" type="button" aria-expanded="false"><i class="fas fa-chart-line"></i> Graphing Calculator</button><div class="graph-panel" id="graphPanel" aria-hidden="true"><div class="graph-toolbar"><input id="graphExpression" class="graph-input" value="x^2" aria-label="Graph expression" placeholder="e.g. x^2 or sin(x)"><button class="graph-button" id="graphPlot" type="button">Plot</button><button class="graph-button" id="graphZoomIn" type="button" aria-label="Zoom in">+</button><button class="graph-button" id="graphZoomOut" type="button" aria-label="Zoom out">−</button></div><div class="graph-canvas-wrap"><canvas id="graphCanvas"></canvas></div><div class="graph-status" id="graphStatus">Drag to pan • Scroll to zoom</div><button class="graph-button" id="graphReset" type="button" style="width:100%;margin-top:.45rem">Reset View</button></div><button class="scientific-toggle statistics-toggle" id="statisticsToggle" type="button" aria-expanded="false"><i class="fas fa-chart-simple"></i> Statistics Mode</button><div class="statistics-panel" id="statisticsPanel" aria-hidden="true"><div class="statistics-toolbar"><input id="statisticsInput" class="statistics-input" aria-label="Statistics data" placeholder="e.g. 2, 4, 4, 6, 8"><button class="statistics-button" id="statisticsCalculate" type="button">Calculate</button><button class="statistics-button" id="statisticsClear" type="button">Clear</button></div><div class="statistics-result" id="statisticsResult"></div><div class="statistics-status" id="statisticsStatus">Enter numbers separated by spaces or commas</div></div><div class="button-grid"><button class="btn btn-function" data-action="clear-all">AC</button><button class="btn btn-function" data-action="clear">C</button><button class="btn btn-function" data-action="backspace" aria-label="Backspace"><i class="fas fa-backspace"></i></button><button class="btn btn-operator" data-action="divide">÷</button><button class="btn btn-number" data-number="7">7</button><button class="btn btn-number" data-number="8">8</button><button class="btn btn-number" data-number="9">9</button><button class="btn btn-operator" data-action="multiply">×</button><button class="btn btn-number" data-number="4">4</button><button class="btn btn-number" data-number="5">5</button><button class="btn btn-number" data-number="6">6</button><button class="btn btn-operator" data-action="subtract">−</button><button class="btn btn-number" data-number="1">1</button><button class="btn btn-number" data-number="2">2</button><button class="btn btn-number" data-number="3">3</button><button class="btn btn-operator" data-action="add">+</button><button class="btn btn-number btn-zero" data-number="0">0</button><button class="btn btn-number" data-action="decimal">.</button><button class="btn btn-equals" data-action="equals">=</button></div></div><div class="calculator-footer"><small class="text-muted">Use keyboard for input • ESC to clear</small></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script><script src="./script.js?v=12"></script><script src="./graph.js?v=3"></script><script src="./statistics.js?v=1"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
