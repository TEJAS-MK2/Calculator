<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, responsive calculator with a safe expression engine, history, themes, and polished animations.">
  <meta name="theme-color" content="#090b10" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <link rel="manifest" href="./manifest.json">
  <title>Modern Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXji0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=16">
  <style>
    .feature-sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:var(--bg-secondary);border-right:1px solid var(--border);box-shadow:18px 0 45px rgba(0,0,0,.3);z-index:1000;transform:translateX(-105%);padding:14px;display:flex;flex-direction:column;gap:10px;will-change:transform}
    .feature-sidebar.is-open{transform:translateX(0)}
    .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);z-index:999;opacity:0;pointer-events:none;transition:opacity .25s ease}
    .sidebar-backdrop.is-open{opacity:1;pointer-events:auto}
    .sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;border-bottom:1px solid var(--border)}
    .sidebar-title{font-size:.9rem;font-weight:600;color:var(--text-primary)}
    .sidebar-close,.sidebar-open{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-primary);cursor:pointer;border-radius:10px;transition:var(--transition)}
    .sidebar-close{width:32px;height:32px}.sidebar-open{position:fixed;top:10px;left:10px;width:36px;height:36px;z-index:1001;font-size:.8rem;box-shadow:0 8px 20px rgba(0,0,0,.18)}
    .sidebar-close:hover,.sidebar-open:hover{background:var(--surface-2);transform:translateY(-1px)}
    .feature-list{display:grid;gap:8px;overflow:auto}
    .feature-item{width:100%;min-height:46px;padding:0 13px;display:flex;align-items:center;gap:10px;border:1px solid var(--border-strong);border-radius:14px;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--accent-soft)));color:var(--text-primary);font:600 .78rem/1 Inter,sans-serif;cursor:pointer;transition:var(--transition);appearance:none;text-align:left;box-shadow:0 5px 16px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.04)}
    .feature-item i{width:18px;display:inline-flex;justify-content:center;align-items:center;color:var(--text-secondary);font-size:.82rem}
    .feature-item:hover{background:linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 82%,var(--accent-soft)));border-color:color-mix(in srgb,var(--accent) 38%,var(--border-strong));transform:translateY(-2px)}
    .feature-item:active{transform:scale(.98)}
    .feature-item.active,.feature-item:focus-visible{background:linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 78%,var(--accent-soft)));border-color:color-mix(in srgb,var(--accent) 45%,var(--border-strong));outline:2px solid color-mix(in srgb,var(--accent) 32%,transparent);outline-offset:1px}
    .sidebar-note{margin-top:auto;color:var(--text-secondary);font-size:.6rem;text-align:center;padding-top:8px;border-top:1px solid var(--border)}
    @media(max-width:480px){.feature-sidebar{width:min(82vw,280px);padding:10px}.sidebar-open{top:8px;left:8px;width:34px;height:34px}.calculator-container{padding-top:2.4rem}}
  </style>
</head>
<body>
  <button class="sidebar-open" id="sidebarOpen" type="button" aria-label="Open calculator features" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="feature-sidebar" id="featureSidebar" aria-hidden="true">
    <div class="sidebar-head">
      <span class="sidebar-title">Calculator Features</span>
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close features"><i class="fas fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="feature-list">
      <button class="feature-item" data-feature="history" type="button"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i><span>History</span></button>
      <button class="feature-item" data-feature="clear" type="button"><i class="fas fa-eraser" aria-hidden="true"></i><span>Clear</span></button>
      <button class="feature-item" data-feature="theme" type="button"><i class="fas fa-circle-half-stroke" aria-hidden="true"></i><span>Change Theme</span></button>
    </div>
    <div class="sidebar-note">Calculator controls</div>
  </aside>

  <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="calculator-container">
      <div class="calculator-header">
        <div class="header-row">
          <h1 class="calculator-title">CALCULATOR</h1>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Change theme"><i class="fas fa-moon" aria-hidden="true"></i></button>
        </div>
      </div>

      <main class="calculator" aria-label="Calculator">
        <div class="display-container" aria-live="polite">
          <div class="expression-preview" id="expressionPreview"></div>
          <div class="display-secondary" id="displaySecondary">0</div>
          <div class="display-primary" id="displayPrimary">0</div>
        </div>

        <div class="calculator-tools">
          <button class="tool-button" id="historyToggle" type="button" aria-expanded="false"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i> History</button>
          <button class="tool-button danger" id="clearHistory" type="button">Clear</button>
        </div>
        <div class="history-panel" id="historyPanel" aria-hidden="true">
          <div class="history-header"><span>Calculation History</span><span class="history-count" id="historyCount">0</span></div>
          <div class="history-list" id="historyList"><div class="history-empty">No calculations yet</div></div>
        </div>

        <div class="button-grid">
          <button class="btn btn-function" data-action="clear-all" type="button">AC</button>
          <button class="btn btn-function" data-action="clear" type="button">C</button>
          <button class="btn btn-function" data-action="backspace" type="button" aria-label="Backspace"><i class="fas fa-backspace" aria-hidden="true"></i></button>
          <button class="btn btn-operator" data-action="divide" type="button">÷</button>
          <button class="btn btn-number" data-number="7" type="button">7</button><button class="btn btn-number" data-number="8" type="button">8</button><button class="btn btn-number" data-number="9" type="button">9</button><button class="btn btn-operator" data-action="multiply" type="button">×</button>
          <button class="btn btn-number" data-number="4" type="button">4</button><button class="btn btn-number" data-number="5" type="button">5</button><button class="btn btn-number" data-number="6" type="button">6</button><button class="btn btn-operator" data-action="subtract" type="button">−</button>
          <button class="btn btn-number" data-number="1" type="button">1</button><button class="btn btn-number" data-number="2" type="button">2</button><button class="btn btn-number" data-number="3" type="button">3</button><button class="btn btn-operator" data-action="add" type="button">+</button>
          <button class="btn btn-number btn-zero" data-number="0" type="button">0</button><button class="btn btn-number" data-action="decimal" type="button">.</button><button class="btn btn-equals" data-action="equals" type="button">=</button>
        </div>
      </main>
      <div class="calculator-footer"><small class="text-muted">Use keyboard for input • ESC to clear</small></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js" integrity="sha512-aNMyYYxdIxIaot0Y1/PLuEu3eipGCmsEUBrUq+7aVyPGMFH8z0eTP0tkqAvv34fzN6z+201d3T8HPb1svWSKHQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>window.__calculatorCoreUIEnabled=true;</script>
  <script src="./sidebar-fix.js?v=14"></script>
  <script src="./script.js?v=14"></script>
  <script src="./animation-enhancements.js?v=4"></script>
  <script src="./sidebar-hardening.js?v=2"></script>
  <script type="module" src="./calculator-core-ui.js?v=2"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body>
</html>
