<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aesthetic Calculator - fast, responsive calculator">
    <meta name="theme-color" content="#000000" id="themeColor">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculator">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>Aesthetic Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
        <div class="calculator-container">
            <div class="calculator-header">
                <div class="header-row">
                    <h1 class="calculator-title">CALCULATOR</h1>
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Change theme" title="Change theme"><i class="fas fa-moon"></i></button>
                </div>
            </div>
            <div class="calculator">
                <div class="display-container"><div class="display-secondary" id="displaySecondary">0</div><div class="display-primary" id="displayPrimary">0</div></div>
                <div class="calculator-tools"><button class="tool-button" id="historyToggle" type="button" aria-expanded="false"><i class="fas fa-clock-rotate-left"></i> History</button><button class="tool-button danger" id="clearHistory" type="button"><i class="fas fa-trash"></i> Clear</button></div>
                <div class="history-panel" id="historyPanel" aria-hidden="true"><div class="history-header"><span>Calculation History</span><span class="history-count" id="historyCount">0</span></div><div class="history-list" id="historyList"><div class="history-empty">No calculations yet</div></div></div>
                <div class="memory-panel"><div class="memory-status"><i class="fas fa-memory"></i><span>Memory</span><strong id="memoryValue">0</strong></div><div class="memory-buttons"><button class="memory-button" data-action="memory-clear">MC</button><button class="memory-button" data-action="memory-recall">MR</button><button class="memory-button" data-action="memory-add">M+</button><button class="memory-button" data-action="memory-subtract">M−</button><button class="memory-button" data-action="memory-store">MS</button></div></div>
                <button class="scientific-toggle" id="scientificToggle" type="button" aria-expanded="false"><i class="fas fa-flask"></i> Scientific Mode</button>
                <div class="scientific-panel" id="scientificPanel" aria-hidden="true"><button class="btn btn-scientific" data-action="sin">sin</button><button class="btn btn-scientific" data-action="cos">cos</button><button class="btn btn-scientific" data-action="tan">tan</button><button class="btn btn-scientific" data-action="log">log</button><button class="btn btn-scientific" data-action="ln">ln</button><button class="btn btn-scientific" data-action="sqrt">√</button><button class="btn btn-scientific" data-action="square">x²</button><button class="btn btn-scientific" data-action="reciprocal">1/x</button><button class="btn btn-scientific" data-action="percent">%</button><button class="btn btn-scientific" data-action="pi">π</button><button class="btn btn-scientific" data-action="e">e</button><button class="btn btn-scientific" data-action="factorial">x!</button></div>
                <div class="button-grid"><button class="btn btn-function" data-action="clear-all">AC</button><button class="btn btn-function" data-action="clear">C</button><button class="btn btn-function" data-action="backspace" aria-label="Backspace"><i class="fas fa-backspace"></i></button><button class="btn btn-operator" data-action="divide">÷</button><button class="btn btn-number" data-number="7">7</button><button class="btn btn-number" data-number="8">8</button><button class="btn btn-number" data-number="9">9</button><button class="btn btn-operator" data-action="multiply">×</button><button class="btn btn-number" data-number="4">4</button><button class="btn btn-number" data-number="5">5</button><button class="btn btn-number" data-number="6">6</button><button class="btn btn-operator" data-action="subtract">−</button><button class="btn btn-number" data-number="1">1</button><button class="btn btn-number" data-number="2">2</button><button class="btn btn-number" data-number="3">3</button><button class="btn btn-operator" data-action="add">+</button><button class="btn btn-number btn-zero" data-number="0">0</button><button class="btn btn-number" data-action="decimal">.</button><button class="btn btn-equals" data-action="equals">=</button></div>
            </div>
            <div class="calculator-footer"><small class="text-muted">Use keyboard for input • ESC to clear</small></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <script src="./script.js?v=8"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
