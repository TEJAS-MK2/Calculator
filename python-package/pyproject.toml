[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pijush-calculator"
version = "0.2.0"
description = "Advanced, dependency-free Python numerical engine with scientific functions, statistics, combinatorics, and reusable math utilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pijush Chakraborty" }]
keywords = ["calculator", "math", "arithmetic", "python", "pijush", "calculation-engine", "scientific", "statistics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics"
]

dependencies = []

[project.urls]
Homepage = "https://github.com/TEJAS-MK2/Calculator"
Repository = "https://github.com/TEJAS-MK2/Calculator"
Issues = "https://github.com/TEJAS-MK2/Calculator/issues"
Changelog = "https://github.com/TEJAS-MK2/Calculator/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/pijush_calculator"]
